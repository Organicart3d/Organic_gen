// Продлеваем плотность за границу области на 2 слоя (потом обрезаем точной формой модели)



// ===== Ключевые случайные числа: каждое значение зависит только от seed, ветки и «тега», а не от порядка вызовов =====

const mix=(h,v)=>{h=Math.imul(h^(v|0),0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);return h^(h>>>16)};

const TG={len:1,phase:2,az:3,ang:4,pos:5,bub:6,aux:8};
const childKey=(k,q)=>hash(k,q+101,977,3)|0;

// ===== Параметры =====
const BASE={baseR:1,tipR:.07,taperP:1.6,midBulge:.3,midPos:.4,midWidth:.45,bubbles:0,bubbleSize:.8,gens:2,kids:3,angle:50,spread:.4,kidLen:.6,kidThick:.6,len:10,curl:.6,tropism:.25,
 noCross:true,bark:0,barkSize:1,rootsOn:true,roots:35,rootSeed:15432,joint:0,blend:.25};

const SAVEK=[...Object.keys(BASE),...Object.keys(COLDEF),'seed','speed','hsm','msm','sizeMM','exportWhat'];

// ===== Профиль отростка: радиус как функция доли длины u (0 — основание, 1 — кончик) =====
const bump=x=>Math.abs(x)>=1?0:.5*(1+Math.cos(Math.PI*x));

  if(bi%25===0){if(!quiet)status('Слияние отростков…',5+Math.round(bi/B.length*55));await tk();if(tok!==undefined&&tok!==mergeTok)return null}}
 if(!quiet)status('Построение поверхности…',65);await tk();if(tok!==undefined&&tok!==mergeTok)return null;
 let m=surfaceNets(F,X,Y,Z,0,hs,ox+.5*hs,oy+.5*hs,oz+.5*hs);if(!m.I.length)throw new Error('поверхность пуста');
 const kl=keepLargest(m.V,m.I);m={V:kl.V,I:kl.I};taubin(m.V,m.I,cfg.msm);for(let i=1;i<m.V.length;i+=3)if(m.V[i]<0)m.V[i]=0;
 const a=analyzeMesh(m.V,m.I);if(a.vol<0){for(let t=0;t<m.I.length;t+=3){const q=m.I[t+1];m.I[t+1]=m.I[t+2];m.I[t+2]=q}a.vol=-a.vol}
 const cl=new Float32Array(m.V.length);
 for(let v=0;v<m.V.length/3;v++){const i=Math.min(X-1,Math.max(0,Math.round((m.V[3*v]-ox)/hs))),j=Math.min(Y-1,Math.max(0,Math.round((m.V[3*v+1]-oy)/hs))),kk=Math.min(Z-1,Math.max(0,Math.round((m.V[3*v+2]-oz)/hs)));
  const id=own[i+X*(j+Y*kk)],b=B[Math.min(B.length-1,id>>8)];branchColor(b.gen,(id&255)/255);cl[3*v]=clr.r;cl[3*v+1]=clr.g;cl[3*v+2]=clr.b}
 return{V:m.V,I:m.I,cl,hs,thick:hs>hs0*1.02,vol:a.vol,bad:a.bad,tris:a.tris,parts:kl.parts}}
function clearMerged(){mergeTok++;if(meshM){scene.remove(meshM);meshM.geometry.dispose();meshM=null}mergedInfo='';if(meshT)meshT.visible=true}
function showMergedView(){if(meshM){meshM.visible=cfg.showMerged;meshT.visible=!cfg.showMerged}}
async function createMerged(){const tok=++mergeTok;
 try{prog=1;playing=false;fillTubes(1);syncTransport();const r=await buildMerged(tok,false);if(!r||tok!==mergeTok)return;
  const g2=new THREE.BufferGeometry();g2.setAttribute('position',new THREE.BufferAttribute(r.V,3));g2.setAttribute('color',new THREE.BufferAttribute(r.cl,3));g2.setIndex(new THREE.BufferAttribute(r.I,1));g2.computeVertexNormals();
  if(meshM){scene.remove(meshM);meshM.geometry.dispose()}meshM=new THREE.Mesh(g2,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.5,metalness:.04}));scene.add(meshM);cfg.showMerged=true;showMergedView();
  mergedInfo='<br><b>Единая форма:</b> '+r.tris+' треуг.'+(r.bad?' · <span style="color:#ff6b6b">открытых рёбер: '+r.bad+'</span>':' · <span style="color:#5fe08a">замкнута ✓</span>')+(r.thick?'<br><span style="color:#ffb86b">сетка укрупнена (память): тонкие кончики утолщены</span>':'')+(cfg.bark>.001?'<br><span style="color:#ffb86b">кора в единой форме не передаётся (есть в «Трубки»)</span>':'');
  gui.controllersRecursive().forEach(c=>c.updateDisplay());status('Единая форма готова: '+r.tris+' треугольников',100,true)}
 catch(e){status('Ошибка: '+e.message,100,true);console.error(e)}}

// ===== Экспорт (STL / OBJ) =====
let DLp=null;function getDL(){if(DLp)return DLp;if(!(window.claude&&window.claude.use))return Promise.resolve(null);return DLp=window.claude.use('downloads').catch(()=>null)}getDL();
function fallbackSave(name,data){const real=name.replace(/\.(obj|stl)\.txt$/,'.$1'),url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));status('',100);
 document.getElementById('stt').innerHTML='<span onclick="this.parentNode.parentNode.style.display=\'none\'" style="cursor:pointer;float:right;margin-left:12px">✕</span>Файл готов: <a download="'+real+'" href="'+url+'" style="color:#7db4ff">Скачать '+real+'</a>'}
async function saveFile(name,data){status('Ожидание подтверждения сохранения…',null);
 try{const d=await getDL();if(!d){fallbackSave(name,data);return}await d.save({filename:name,data});status('Сохранено: '+name+' ✓',100,true)}
 catch(e){const c=e&&e.code;status(c==='declined'?'Сохранение отменено':'Ошибка сохранения'+(c?' ('+c+')':''),100,true)}}
function meshBox(V){const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];for(let i=0;i<V.length;i+=3)for(let d=0;d<3;d++){mn[d]=Math.min(mn[d],V[i+d]);mx[d]=Math.max(mx[d],V[i+d])}return{mn,mx,x:mx[0]-mn[0],y:mx[1]-mn[1],z:mx[2]-mn[2]}}
function printCoords(V){ // Y-вверх → Z-вверх, центр по XY, низ на z=0, длиннейшая сторона = «Размер при печати, мм»
 const b=meshBox(V),k=cfg.sizeMM/Math.max(b.x,b.y,b.z),o=new Float32Array(V.length),cx=(b.mn[0]+b.mx[0])/2,cz=(b.mn[2]+b.mx[2])/2;
 for(let i=0;i<V.length;i+=3){o[i]=(V[i]-cx)*k;o[i+1]=-(V[i+2]-cz)*k;o[i+2]=(V[i+1]-b.mn[1])*k}return o}
let expBusy=false;
async function getExportMesh(){
 if(cfg.exportWhat==='Единая форма'){status('Экспорт: построение единой формы…',5);const r=await buildMerged(undefined,false);return r&&{V:r.V,I:r.I}}
 fillTubes(1);const V=pos.slice(0,vCount*3),I=idx.slice(0,iCount);fillTubes(prog);return{V,I}}
function stlBuffer(V,I){const nt=I.length/3,buf=new ArrayBuffer(84+nt*50),dv=new DataView(buf);dv.setUint32(80,nt,true);
 for(let t=0;t<nt;t++){const a=I[3*t],b=I[3*t+1],c=I[3*t+2],o=84+t*50,ux=V[3*b]-V[3*a],uy=V[3*b+1]-V[3*a+1],uz=V[3*b+2]-V[3*a+2],vx=V[3*c]-V[3*a],vy=V[3*c+1]-V[3*a+1],vz=V[3*c+2]-V[3*a+2];
  let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;[nx/l,ny/l,nz/l].forEach((q,i)=>dv.setFloat32(o+4*i,q,true));
  [a,b,c].forEach((v,k)=>{for(let d=0;d<3;d++)dv.setFloat32(o+12+12*k+4*d,V[3*v+d],true)})}
 return buf}
function objText(V,I){const out=['# Organik 2 (mm, Z-up)','o organik2'];for(let i=0;i<V.length;i+=3)out.push('v '+V[i].toFixed(3)+' '+V[i+1].toFixed(3)+' '+V[i+2].toFixed(3));
 for(let i=0;i<I.length;i+=3)out.push('f '+(I[i]+1)+' '+(I[i+1]+1)+' '+(I[i+2]+1));return out.join('\n')}
async function exportModel(fmt){if(expBusy)return;expBusy=true;
 try{if(!B.length)return;const m=await getExportMesh();if(!m){status('Нечего экспортировать',100,true);return}
  const V=printCoords(m.V),I=m.I;status('Подготовка файла…',80);await tk();
  if(fmt==='stl')await saveFile('organik2.stl.txt',new Blob([stlBuffer(V,I)]));else await saveFile('organik2.obj.txt',new Blob([objText(V,I)]))
 }catch(e){status('Ошибка экспорта: '+e.message,100,true);console.error(e)}finally{expBusy=false}}

// ===== Свои пресеты (сохраняются в браузере) =====
let prog=0,playing=true,curUser=-2,USER=[]; // curUser: -1 — «По умолчанию», -2 — несохранённые настройки
const LSK='organik2.userPresets';
function loadUser(){try{USER=JSON.parse(localStorage.getItem(LSK)||'[]')}catch(e){USER=[]}if(!Array.isArray(USER))USER=[]}
function persistUser(){try{localStorage.setItem(LSK,JSON.stringify(USER));return true}catch(e){status('Не удалось сохранить: хранилище браузера недоступно',100,true);return false}}
function updateLabel(){document.getElementById('plabel').textContent=curUser>=0?USER[curUser].name:curUser===-1?'По умолчанию':'Мои настройки'}
function renderUser(){const box=document.getElementById('mypresets');box.innerHTML='';
 const df=document.createElement('button');df.textContent='По умолчанию';if(curUser===-1)df.className='on';df.onclick=applyDefault;box.appendChild(df);
 USER.forEach((u,i)=>{const bt=document.createElement('button');bt.textContent=u.name;if(i===curUser)bt.className='on';bt.onclick=()=>applyUser(i);
  const x=document.createElement('span');x.className='x';x.textContent='×';x.title='Удалить пресет';x.onclick=e=>{e.stopPropagation();USER.splice(i,1);if(curUser===i)curUser=-2;else if(curUser>i)curUser--;persistUser();renderUser();updateLabel();status('Пресет удалён',100,true)};bt.appendChild(x);box.appendChild(bt)});
 const sv=document.createElement('button');sv.textContent='💾 Сохранить пресет';sv.className='sv';sv.onclick=openSave;box.appendChild(sv)}
function openSave(){const inp=document.getElementById('pname');document.getElementById('modal').style.display='flex';inp.value=curUser>=0?USER[curUser].name:'';inp.focus&&inp.focus()}
function closeModal(){document.getElementById('modal').style.display='none'}
function confirmSave(){const name=(document.getElementById('pname').value||'').trim().slice(0,40);if(!name){status('Введите название пресета',100,true);return}
 const vals={};for(const k of SAVEK)vals[k]=cfg[k];const i=USER.findIndex(u=>u.name===name),rec={name,vals};
 if(i>=0)USER[i]=rec;else USER.push(rec);curUser=i>=0?i:USER.length-1;closeModal();if(persistUser())status('Пресет «'+name+'» сохранён',100,true);renderUser();updateLabel()}
function applyVals(v){Object.assign(cfg,v);gui.controllersRecursive().forEach(c=>c.updateDisplay());syncColorUI();prog=0;playing=true;regen();syncTransport()}
function applyUser(i){const u=USER[i];if(!u)return;curUser=i;applyVals(u.vals);renderUser();updateLabel()}
function applyDefault(){curUser=-1;applyVals({...BASE,...COLDEF,seed:7,speed:1,hsm:.1,msm:4,sizeMM:100,exportWhat:'Единая форма'});renderUser();updateLabel()}
function touched(){if(curUser!==-2){curUser=-2;renderUser();updateLabel()}} // правка параметров отвязывает от выбранного пресета
function regen(){clearMerged();genBranches();allocTubes();fillTubes(prog);drawProfile();drawRootProfile()}
function setProg(v){prog=Math.max(0,Math.min(1,v));if(meshM)clearMerged();fillTubes(prog)}

// ===== Управление ростом (значки, как в плеере) =====
const bPlay=document.getElementById('bPlay'),progEl=document.getElementById('prog'),progV=document.getElementById('progv');
function syncTransport(){const on=playing&&prog<1;bPlay.textContent=on?'⏸':'▶';bPlay.className=on?'pl':'';progEl.value=Math.round(prog*1000);progV.textContent='прогресс роста '+Math.round(prog*100)+'%'}
const ctrl={
 play(){if(playing&&prog<1)playing=false;else{if(prog>=1)prog=0;playing=true;clearMerged()}syncTransport()},
 reset(){playing=false;prog=0;clearMerged();fillTubes(0);syncTransport()}};
bPlay.onclick=ctrl.play;document.getElementById('bRes').onclick=ctrl.reset;
progEl.oninput=()=>{playing=false;setProg(progEl.value/1000);syncTransport()};

// ===== Панель параметров =====
const gui=new lil.GUI({title:'Отростки'});
const fP=gui.addFolder('Отросток (профиль)'),fB=gui.addFolder('Ответвления'),fF=gui.addFolder('Форма'),fK=gui.addFolder('Кора и корни'),fJ=gui.addFolder('Соединения'),fC=gui.addFolder('Цвет'),fG=gui.addFolder('Рост'),fM=gui.addFolder('Единая форма (слияние)'),fX=gui.addFolder('Экспорт');
const onP=()=>{touched();regen()};
const add=(f,name,min,max,step,label)=>f.add(cfg,name,min,max,step).name(label).onChange(onP);

add(fP,'baseR',.1,3,.01,'Толщина основания');add(fP,'tipR',0,1.5,.005,'Толщина кончика');add(fP,'taperP',.5,3,.01,'Кривизна сужения');
add(fP,'midBulge',0,2,.01,'Раздувание середины');add(fP,'midPos',.1,.9,.01,'Положение раздувания');add(fP,'midWidth',.1,.9,.01,'Ширина раздувания');

add(fB,'gens',0,4,1,'Поколений');add(fB,'kids',0,6,1,'Ответвлений на отросток');add(fB,'angle',10,90,1,'Угол отхода');add(fB,'spread',0,1,.01,'Разброс угла');add(fB,'kidLen',.2,1,.01,'Длина дочерних');add(fB,'kidThick',.2,.9,.01,'Толщина дочерних');

add(fJ,'joint',0,1,.01,'Сглаживание соединений (фаска)');
const hueC=fC.add(cfg,'hue',0,1,.001).name('Цвет структуры').onChange(onP),baseC=fC.add(cfg,'hueBase',0,1,.001).name('Цвет основания').onChange(onP),tipC=fC.add(cfg,'hueTip',0,1,.001).name('Цвет отростков').onChange(onP);

fC.close();fX.close();fG.close();fJ.open();fK.open();

 if(ft>.5){hud.innerHTML='Отростков: '+B.length+' · Треугольников: '+(iCount/3|0)+' · FPS: '+Math.round(fr/ft)+mergedInfo;fr=0;ft=0}
})(performance.now());
