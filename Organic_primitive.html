<body>
<div id="hud"></div>
<div id="lp"></div>
<div id="modal"><div><b>Сбросить всё?</b><p>Будут удалены структура, меш, загруженная модель, точки и все параметры. Откроется стартовая страница с плоскостью.</p><button class="danger" onclick="doReset()">Сбросить</button><button onclick="closeModal()">Отмена</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// ===== Конфигурация (все параметры в одном объекте) =====
const MODES=['Дерево','Плоскость','Сфера','Куб','Тор','Своя модель','Объём модели'];
const cfg={mode:'Плоскость',area:'Плоскость',shape:'Куб',rndSeed:true,growth:1,paused:false,branch:.4,angle:70,random:.5,energy:50,size:.35,taper:.6,avoid:.6,seed:7,limit:12000,
  wind:.2,windDir:0,density:.3,temp:20,light:1,lightAz:40,lightElev:55,guide:true,region:'Полость внутри',openSides:1,surfSide:'Внешняя',fill:.6,pers:.7,gap:0,wall:.3,decay:0,
  modelMM:100,tmin:.5,tmax:5,mmesh:0,mthick:1,msm:5,showMesh:true,mix:false};
const DEFAULT=JSON.parse(JSON.stringify(cfg));
const PRESETS={
 'Дерево':{mode:'Дерево',branch:.16,angle:35,random:.2,density:.2,temp:15,taper:.7,wind:.15,size:.45,energy:80},
 'Дерево (трубки)':{mode:'Дерево',shape:'Трубки',branch:.16,angle:35,random:.2,density:.2,temp:15,taper:.8,wind:.15,size:.5,energy:80},
 'Корни в объёме (плотно)':{mode:'Объём модели',shape:'Куб',fill:.9,pers:.5,branch:.3,size:.28,energy:200,taper:.3,random:.3,limit:20000,angle:50,wall:.3,decay:0,tmin:.5,tmax:3},
 'Корни в объёме (редко)':{mode:'Объём модели',shape:'Трубки',fill:.15,pers:.85,branch:.25,size:.35,energy:200,taper:.5,random:.2,limit:6000,angle:60,wall:.2,decay:.4,tmin:.8,tmax:8},
 'Корневая система в полости':{mode:'Объём модели',region:'Полость внутри',shape:'Трубки',fill:.7,pers:.45,branch:.35,angle:55,random:.35,taper:.6,energy:200,size:.3,limit:15000,wall:.5,decay:.3,tmin:.5,tmax:6},
 'Куст':{mode:'Дерево',branch:.35,angle:50,random:.45,density:.25,energy:45,taper:.4,temp:22,size:.4},
 'Коралл':{mode:'Сфера',branch:.3,angle:45,random:.35,energy:55,density:.35,temp:28,size:.4},
 'Мох на плоскости':{mode:'Плоскость',branch:.4,angle:70,random:.5,energy:50,size:.35,temp:20,density:.3},
 'Кристалл':{mode:'Дерево',temp:-15,branch:.1,random:.1,angle:90,size:.4,density:.3,energy:50},
 'Массивный нарост':{mode:'Сфера',density:.9,branch:.15,size:.8,temp:30,energy:35,taper:.2,random:.3}
};
const Umm=()=>10/cfg.modelMM; // единиц сцены в 1 мм: 10 ед. = «Размер модели, мм»
const Smin=()=>cfg.tmin*Umm(),Smax=()=>Math.max(cfg.tmax,cfg.tmin)*Umm(),clampT=s=>Math.min(Smax(),Math.max(Smin(),s)),thick=f=>Smin()+(Smax()-Smin())*Math.max(0,Math.min(1,f)),genF=()=>Math.max(.25,1-cfg.taper*.5); // genF: во сколько раз тоньше каждый следующий порядок ветвления
const MAX=40000, TICK=.05, SIG=.3; // SIG: насколько быстро растёт требуемый зазор между ветками одного дерева (расходящиеся развилки)

// ===== Генератор случайных чисел (seed) =====
let _s=1;function seedRng(s){_s=(s>>>0)||1}
function rnd(){_s|=0;_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

// ===== Сцена =====
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05060a);scene.fog=new THREE.FogExp2(0x05060a,.012);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);camera.position.set(14,10,14);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const amb=new THREE.HemisphereLight(0x8899bb,0x111118,.5);scene.add(amb);
const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const fillL=new THREE.DirectionalLight(0x8fa8d8,.3);scene.add(fillL); // мягкая контровая подсветка: на рост не влияет
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:80});scene.add(sun);
const mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({roughness:.55,metalness:.1}),MAX);
mesh.castShadow=mesh.receiveShadow=true;mesh.frustumCulled=false;mesh.count=0;
mesh.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MAX*3),3);scene.add(mesh);
const tubeMesh=new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,8,1,true),mesh.material,MAX);tubeMesh.castShadow=true;tubeMesh.frustumCulled=false;tubeMesh.count=0;tubeMesh.visible=false;
tubeMesh.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MAX*3),3);scene.add(tubeMesh);
let guide=null;
// ===== Формы элементов =====
const SHAPES=['Куб','Сфера','Пирамида','Капсула','Октаэдр','Трубки'];
function makeGeo(n){
 if(n==='Сфера')return new THREE.IcosahedronGeometry(.5,1);
 if(n==='Пирамида')return new THREE.ConeGeometry(.75,1,4).rotateY(Math.PI/4);
 if(n==='Октаэдр')return new THREE.OctahedronGeometry(.7);
 if(n==='Трубки')return new THREE.IcosahedronGeometry(.5,2); // узлы-сферы + трубки между ними
 if(n==='Капсула'){const pts=[],r=.3,h=.25;
  for(let i=0;i<=6;i++){const a=-Math.PI/2+i*Math.PI/12;pts.push(new THREE.Vector2(Math.max(0,Math.cos(a)*r),-h+Math.sin(a)*r))}
  for(let i=0;i<=6;i++){const a=i*Math.PI/12;pts.push(new THREE.Vector2(Math.max(0,Math.cos(a)*r),h+Math.sin(a)*r))}
  return new THREE.LatheGeometry(pts,10)}
 return new THREE.BoxGeometry(1,1,1);
}
function applyShape(){const o=mesh.geometry;mesh.geometry=makeGeo(cfg.shape);o.dispose();tubeMesh.visible=cfg.shape==='Трубки'&&!(meshObj&&cfg.showMesh)}
// ===== Статус-бар сохранения =====
let stT,busy=false;const tk=()=>new Promise(r=>setTimeout(r,0));
function status(t,p,hide){const s=document.getElementById('st'),f=document.getElementById('stf');clearTimeout(stT);s.style.display='block';
 document.getElementById('stt').textContent=t;f.style.width=(p==null?40:p)+'%';f.className=p==null?'ind':'';if(hide)stT=setTimeout(()=>s.style.display='none',4000)}
let DLp=null; // capability запрашиваем заранее, чтобы не ждать при клике
function getDL(){if(DLp)return DLp;if(!(window.claude&&window.claude.use))return Promise.resolve(null);return DLp=window.claude.use('downloads').catch(()=>null)}
getDL();
function fallbackSave(name,data){ // вне приложения Claude: обычная ссылка на скачивание
 const real=name.replace(/\.(obj|stl)\.txt$/,'.$1'),isImg=/\.png$/.test(real),url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));
 status('',100);
 document.getElementById('stt').innerHTML='<span onclick="this.parentNode.parentNode.style.display=\'none\'" style="cursor:pointer;float:right;margin-left:12px">✕</span>Файл готов: <a download="'+real+'" href="'+url+'" style="color:#7db4ff">Скачать '+real+'</a>'+(isImg?'<br><img src="'+url+'" style="max-width:220px;margin-top:6px;border-radius:4px" alt="">':'');
}
async function saveFile(name,data){ // общий путь сохранения через capability downloads
 status('Ожидание подтверждения сохранения…',null);
 try{const d=await getDL();
  if(!d){fallbackSave(name,data);return 'ok'}
  await d.save({filename:name,data});status('Сохранено: '+name+' ✓',100,true);return 'ok'}
 catch(e){const c=e&&e.code;status(c==='declined'?'Сохранение отменено':'Ошибка сохранения'+(c?' ('+c+')':''),100,true);return c==='declined'?'declined':'err'}
}
async function savePNG(){ // PNG 2× для референсов
 if(busy)return;busy=true;
 try{status('Рендер кадра 2×…',20);await tk();
  const pr=renderer.getPixelRatio();renderer.setPixelRatio(2);renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);
  const b=await new Promise(r=>renderer.domElement.toBlob(r,'image/png'));
  renderer.setPixelRatio(pr);renderer.setSize(innerWidth,innerHeight);
  if(!b){status('Не удалось создать PNG',100,true);return}
  status('Кодирование PNG…',70);await tk();await saveFile('organism.png',b)
 }finally{busy=false}
}
// ===== Экспорт OBJ (текущие позиции, поворот и размер всех элементов) =====
async function objPart(ms,out,off,N,tot,base){
 const geo=ms.geometry,pos=geo.attributes.position,idx=geo.index,m=new THREE.Matrix4(),v=new THREE.Vector3();
 for(let i=0;i<N;i++){
  if(i%150===0){status('Сборка модели…',Math.round((base+i)/tot*85));await tk()}
  ms.getMatrixAt(i,m);
  for(let k=0;k<pos.count;k++){v.fromBufferAttribute(pos,k).applyMatrix4(m);out.push('v '+v.x.toFixed(4)+' '+v.y.toFixed(4)+' '+v.z.toFixed(4))}
  const nf=idx?idx.count:pos.count;
  for(let k=0;k<nf;k+=3){const a=idx?idx.getX(k):k,b=idx?idx.getX(k+1):k+1,c=idx?idx.getX(k+2):k+2;out.push('f '+(a+off)+' '+(b+off)+' '+(c+off))}
  off+=pos.count;
 }
 return off}
async function exportOBJ(){
 if(busy)return;busy=true;
 try{status('Сборка модели…',0);await tk();
  const N=org.n,parts=tubeMesh.visible?[mesh,tubeMesh]:[mesh],out=['# Living cube organism','o organism'];let off=1;
  for(let j=0;j<parts.length;j++)off=await objPart(parts[j],out,off,N,N*parts.length,N*j);
  status('Подготовка файла…',90);await tk();
  const text=out.join('\n');await saveFile('organism.obj.txt',new Blob([text]));
 }finally{busy=false}
}

// ===== Среда =====
class Environment{
 static tn(){return(cfg.temp+20)/60}
 static windVec(){const a=cfg.windDir*Math.PI/180;return new THREE.Vector3(Math.cos(a),0,Math.sin(a))}
 static lightDir(){const az=cfg.lightAz*Math.PI/180,el=cfg.lightElev*Math.PI/180;
  return new THREE.Vector3(Math.cos(az)*Math.cos(el),Math.sin(el),Math.sin(az)*Math.cos(el))}
 static apply(){const L=Environment.lightDir();sun.position.copy(L).multiplyScalar(40);sun.intensity=cfg.light*1.5;amb.intensity=.15+cfg.light*.35;fillL.position.set(-L.x*40,Math.max(6,L.y*14),-L.z*40);fillL.intensity=.26+.1*Math.min(1.5,cfg.light)}
}

// ===== Пространственная хэш-сетка =====
class SpatialHash{
 constructor(){this.m=new Map()}
 key(p,c){return(Math.floor(p.x/c)*73856093)^(Math.floor(p.y/c)*19349663)^(Math.floor(p.z/c)*83492791)}
 get(p,c){return this.m.get(this.key(p,c))||0}
 add(p,c){const k=this.key(p,c);this.m.set(k,(this.m.get(k)||0)+1)}
 clear(){this.m.clear()}
}

// ===== Проекция на поверхность примитива =====
let SN=new THREE.Vector3(0,1,0);
// ===== Точка роста и МИКС: клик по поверхности направляющей =====
let SEEDPT=null,SEEDN=null,picking=null,pickCtl=null,mixCtl=null,down=null,startBtn=null,MIXPTS=[],mixMk=new THREE.Group();scene.add(mixMk);
const marker=new THREE.Mesh(new THREE.SphereGeometry(.18,12,8),new THREE.MeshBasicMaterial({color:0x4aa3ff}));marker.visible=false;scene.add(marker);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({visible:false}));scene.add(ground);
function setPickNames(){if(pickCtl)pickCtl.name(picking==='seed'?'Кликните по поверхности…':'Задать точку роста');if(mixCtl)mixCtl.name(cfg.mix?'МИКС: включён (кликайте — точки)':'МИКС: добавить структуру')}
function togglePick(){picking=picking==='seed'?null:'seed';if(cfg.mix&&picking==='seed')cfg.mix=false;setPickNames()}
function clearPick(){SEEDPT=null;org.reset()}
function refreshMix(){scene.remove(mixMk);mixMk=new THREE.Group();scene.add(mixMk);for(const q of MIXPTS){const m=new THREE.Mesh(new THREE.SphereGeometry(.15,10,8),new THREE.MeshBasicMaterial({color:0xffa040}));m.position.copy(q.p);mixMk.add(m)}}
function toggleMix(){cfg.mix=!cfg.mix;picking=cfg.mix?'mix':null;if(!cfg.mix){MIXPTS=[];refreshMix()}setPickNames();
 status(cfg.mix?'МИКС: кликайте по детали, чтобы поставить точки, и нажмите «Старт» — новая структура добавится к текущей':'МИКС выключен',100,true)}
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
renderer.domElement.addEventListener('pointerup',e=>{ // клик без перетаскивания камеры
 if(!picking||!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;
 const r=new THREE.Raycaster();r.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),camera);
 const h=r.intersectObject(guide||ground)[0];if(!h)return;const nr=h.face?h.face.normal.clone():null;
 if(picking==='seed'){SEEDPT=h.point.clone();SEEDN=nr;togglePick();org.reset()}else{MIXPTS.push({p:h.point.clone(),n:nr});refreshMix()}
});
// ===== Своя модель как направляющая (.obj/.glb) =====
const CUSTOM={geo:null,tris:[],grid:new Map};
function nearestCustom(p){
 let best=null,bd=1e9,bt=null;const q=new THREE.Vector3();
 const scan=l=>{for(const t of l){t.closestPointToPoint(p,q);const d=q.distanceToSquared(p);if(d<bd){bd=d;best=q.clone();bt=t}}};
 const cx=Math.floor(p.x),cy=Math.floor(p.y),cz=Math.floor(p.z);
 for(let x=cx-1;x<=cx+1;x++)for(let y=cy-1;y<=cy+1;y++)for(let z=cz-1;z<=cz+1;z++){const l=CUSTOM.grid.get(x+','+y+','+z);if(l)scan(l)}
 if(!best)scan(CUSTOM.tris);
 bt.getNormal(SN);if(!SN.lengthSq())SN.set(0,1,0);if(SN.dot(p.clone().sub(best))<0)SN.negate();
 return best;
}
function setModelFromObject(obj){
  const P=[];obj.updateMatrixWorld(true);
  obj.traverse(o=>{if(!o.isMesh)return;const p=o.geometry.attributes.position,ix=o.geometry.index,v=i=>new THREE.Vector3().fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld),n=ix?ix.count:p.count;
   for(let k=0;k+2<n;k+=3)P.push(v(ix?ix.getX(k):k),v(ix?ix.getX(k+1):k+1),v(ix?ix.getX(k+2):k+2))});
  if(!P.length)return;
  const bb=new THREE.Box3().setFromPoints(P),c=bb.getCenter(new THREE.Vector3()),sc=10/Math.max(...bb.getSize(new THREE.Vector3()).toArray());
  P.forEach(q=>q.sub(c).multiplyScalar(sc)); // нормализуем до ~10 единиц
  CUSTOM.tris=[];CUSTOM.grid.clear();
  for(let i=0;i<P.length;i+=3){const t=new THREE.Triangle(P[i],P[i+1],P[i+2]);CUSTOM.tris.push(t);const b=new THREE.Box3().setFromPoints([P[i],P[i+1],P[i+2]]);
   for(let x=Math.floor(b.min.x);x<=Math.floor(b.max.x);x++)for(let y=Math.floor(b.min.y);y<=Math.floor(b.max.y);y++)for(let z=Math.floor(b.min.z);z<=Math.floor(b.max.z);z++){const k=x+','+y+','+z;let l=CUSTOM.grid.get(k);if(!l)CUSTOM.grid.set(k,l=[]);l.push(t)}}
  CUSTOM.geo=new THREE.BufferGeometry().setFromPoints(P);
  {const T=new Float32Array(P.length*3);P.forEach((q,i)=>{T[i*3]=q.x;T[i*3+1]=q.y;T[i*3+2]=q.z});buildAllow(T)}
  SEEDPT=null;cfg.area=ALLOW.cav?AREAS[5]:AREAS[6];applyArea();ui.sync();org.reset();
  status(ALLOW.cav?'Модель загружена. '+(ALLOW.how==='оболочка'?'Замкнутая оболочка: внутри пустой объём ('+ALLOW.cavCnt+' вокс.)':'Найдена полость между стенками ('+ALLOW.cavCnt+' вокс.)')+'. Выберите «Режим роста» и нажмите «Старт»':'Модель загружена. Полость не найдена: режим «Объём модели» будет заполнять объём внутри модели',100,true);
}
function loadModel(file){
 const ext=file.name.split('.').pop().toLowerCase(),rd=new FileReader(),done=setModelFromObject;
 rd.onload=()=>{try{ext==='obj'?done(new THREE.OBJLoader().parse(rd.result)):new THREE.GLTFLoader().parse(rd.result,'',g=>done(g.scene),()=>{})}catch(e){}};
 ext==='obj'?rd.readAsText(file):rd.readAsArrayBuffer(file);
}
function surf(p){const m=MODES.indexOf(cfg.mode);
 if(m===5&&CUSTOM.tris.length){const q=nearestCustom(p);if(cfg.surfSide==='Внутренняя')faceCavity(q);return q}
 if(m===1||m===5){SN.set(0,1,0);return new THREE.Vector3(p.x,0,p.z)}
 if(m===2){SN=p.clone().normalize();if(!SN.lengthSq())SN.set(0,1,0);return SN.clone().multiplyScalar(4)}

   for(let k=k0;k<=k1;k++){const dz=oz+k*hs-z;for(let j=j0;j<=j1;j++){const dy=oy+j*hs-y,b=dy*dy+dz*dz;if(b>R2)continue;
    for(let i=i0;i<=i1;i++){const dx=ox+i*hs-x,d2=dx*dx+b;if(d2>R2)continue;let v=.5+(r-Math.sqrt(d2))/hs;if(v<=0)continue;if(v>1)v=1;const q=i+X*(j+Y*k);if(v>F[q]){F[q]=v;own[q]=id}}}}};
  const rad=i=>Math.max(S[i]*.5*T,.75*hs);
  for(let i=0;i<n;i++){const ri=rad(i);stamp(P[i*3],P[i*3+1],P[i*3+2],ri,i);const q=Q[i];
   if(q>=0){const ax=P[q*3],ay=P[q*3+1],az=P[q*3+2],bx=P[i*3],by=P[i*3+1],bz=P[i*3+2],L=Math.hypot(bx-ax,by-ay,bz-az),ra=rad(q),sp=Math.max(.5*hs,.3*Math.min(ra,ri)),st=Math.ceil(L/sp);
    for(let t=1;t<st;t++){const u=t/st;stamp(ax+(bx-ax)*u,ay+(by-ay)*u,az+(bz-az)*u,ra+(ri-ra)*u,i)}}
   if(i%300===0){status('Меш: заполнение поля…',5+Math.round(i/n*45));await tk()}}
  status('Меш: построение поверхности…',60);await tk();
  let m=surfaceNets(F,X,Y,Z,.5,hs,ox+.5*hs,oy+.5*hs,oz+.5*hs);if(!m.I.length)throw new Error('поверхность пуста');
  const kl=keepLargest(m.V,m.I);m={V:kl.V,I:kl.I};status('Меш: сглаживание поверхности…',75);await tk();taubin(m.V,m.I,cfg.msm);
  const a=analyzeMesh(m.V,m.I);if(a.vol<0){for(let t=0;t<m.I.length;t+=3){const q=m.I[t+1];m.I[t+1]=m.I[t+2];m.I[t+2]=q}a.vol=-a.vol}
  const col=new Float32Array(m.V.length),c=new THREE.Color(),tn=Environment.tn();
  for(let v=0;v<m.V.length/3;v++){let id=65535;const i0=Math.round((m.V[3*v]-ox)/hs),j0=Math.round((m.V[3*v+1]-oy)/hs),k0=Math.round((m.V[3*v+2]-oz)/hs);
   for(let r=0;r<3&&id===65535;r++)for(let dk=-r;dk<=r&&id===65535;dk++)for(let dj=-r;dj<=r&&id===65535;dj++)for(let di=-r;di<=r&&id===65535;di++){const i=i0+di,j=j0+dj,k=k0+dk;if(i>=0&&j>=0&&k>=0&&i<X&&j<Y&&k<Z)id=own[i+X*(j+Y*k)]}
   if(id===65535)id=0;c.setHSL(.62-.58*tn+(org.J[id]-.5)*.08,.65,.2+.5*org.U[id]);col[3*v]=c.r;col[3*v+1]=c.g;col[3*v+2]=c.b}
  clearMeshObj();const g2=new THREE.BufferGeometry();g2.setAttribute('position',new THREE.BufferAttribute(m.V,3));g2.setAttribute('color',new THREE.BufferAttribute(col,3));g2.setIndex(new THREE.BufferAttribute(m.I,1));g2.computeVertexNormals();
  meshObj=new THREE.Mesh(g2,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.5,metalness:.1}));meshObj.castShadow=meshObj.receiveShadow=true;scene.add(meshObj);
  MESHR={V:m.V,I:m.I,vol:a.vol,bad:a.bad,tris:a.tris,parts:kl.parts};cfg.showMesh=true;setMeshVisible();if(typeof ui!=='undefined')ui.upd();
  const bb=meshBox(m.V),red='color:#ff6b6b',okc='color:#5fe08a';
  meshInfo='<br><b>Меш:</b> '+a.tris+' треуг. · '+(bb.x*mmU).toFixed(0)+'×'+(bb.z*mmU).toFixed(0)+'×'+(bb.y*mmU).toFixed(0)+' мм · объём '+(a.vol*mmU**3/1000).toFixed(1)+' см³<br>'+(a.bad?'<span style="'+red+'">открытых рёбер: '+a.bad+'</span>':'<span style="'+okc+'">замкнутый, пригоден для печати ✓</span>')+(kl.parts>1?'<br><span style="'+red+'">несвязных частей: '+kl.parts+'</span>':'')+
   '<br>Сетка меша: '+(hs*mmU).toFixed(2)+' мм'+(limited?'<br><span style="'+red+'">тонкие корни в меше утолщены до ~'+(1.5*hs*mmU).toFixed(1)+' мм (ограничение памяти): уменьшите «Размер модели» или поднимите «Мин. толщину»</span>':'');
  status('Меш готов: '+a.tris+' треугольников',100,true)
 }catch(e){status('Ошибка меша: '+e.message,100,true);console.error(e)}finally{busy=false}}
function printMesh(){ // Y-вверх → Z-вверх, центр по XY, низ на z=0, масштаб в мм
 const V=MESHR.V,b=meshBox(V),k=cfg.modelMM/10,o=new Float32Array(V.length),cx=(b.mn[0]+b.mx[0])/2,cz=(b.mn[2]+b.mx[2])/2;
 for(let i=0;i<V.length;i+=3){o[i]=(V[i]-cx)*k;o[i+1]=-(V[i+2]-cz)*k;o[i+2]=(V[i+1]-b.mn[1])*k}return o}
async function exportMeshSTL(){if(!MESHR)return status('Сначала нажмите «Создать меш»',100,true);if(busy)return;busy=true;
 try{const V=printMesh(),I=MESHR.I,nt=I.length/3,buf=new ArrayBuffer(84+nt*50),dv=new DataView(buf);status('Подготовка STL…',50);await tk();dv.setUint32(80,nt,true);
  for(let t=0;t<nt;t++){const a=I[3*t],b=I[3*t+1],c=I[3*t+2],o=84+t*50,ux=V[3*b]-V[3*a],uy=V[3*b+1]-V[3*a+1],uz=V[3*b+2]-V[3*a+2],vx=V[3*c]-V[3*a],vy=V[3*c+1]-V[3*a+1],vz=V[3*c+2]-V[3*a+2];
   let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;[nx/l,ny/l,nz/l].forEach((q,i)=>dv.setFloat32(o+4*i,q,true));
   [a,b,c].forEach((v,k)=>{for(let d=0;d<3;d++)dv.setFloat32(o+12+12*k+4*d,V[3*v+d],true)})}
  await saveFile('organik.stl.txt',new Blob([buf]))}finally{busy=false}}
async function exportMeshOBJ(){if(!MESHR)return status('Сначала нажмите «Создать меш»',100,true);if(busy)return;busy=true;
 try{const V=printMesh(),I=MESHR.I,out=['# Organik mesh (mm, Z-up)','o organik'];status('Подготовка OBJ…',50);await tk();
  for(let i=0;i<V.length;i+=3)out.push('v '+V[i].toFixed(3)+' '+V[i+1].toFixed(3)+' '+V[i+2].toFixed(3));
  for(let i=0;i<I.length;i+=3)out.push('f '+(I[i]+1)+' '+(I[i+1]+1)+' '+(I[i+2]+1));await saveFile('organik.obj.txt',new Blob([out.join('\n')]))}finally{busy=false}}

// ===== Интерфейс: слева — модель, точки и запуск; справа — регулировки =====
function startAction(){
 if(cfg.mix&&org.n>0){if(!MIXPTS.length){status('МИКС: сначала кликните по детали — поставьте точки новой структуры',100,true);return}
  for(const q of MIXPTS)org.addSeed(q.p,q.n);MIXPTS=[];refreshMix();org.run=true;return}
 if(cfg.area.startsWith('Модель')&&!CUSTOM.tris.length){status('Сначала загрузите модель (.obj/.glb)',100,true);return}
 if(cfg.rndSeed)cfg.seed=Math.floor(Math.random()*99999);ui.upd();org.reset();org.run=true}
function askReset(){document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function doReset(){closeModal();Object.assign(cfg,DEFAULT);picking=null;SEEDPT=null;SEEDN=null;MIXPTS=[];refreshMix();
 CUSTOM.geo=null;CUSTOM.tris=[];CUSTOM.grid.clear();Object.assign(ALLOW,{g:null,ins:null,srf:null,hit:null,cav:null,cen:null,cavCen:null,wallIdx:null,cnt:0,cavCnt:0,note:''});
 setPickNames();ui.sync();ui.upd();org.reset();camera.position.set(14,10,14);controls.target.set(0,2,0);status('Сброшено до стартовой страницы',100,true)}
class UI{
 constructor(org){
  const gl=this.gl=new lil.GUI({title:'Модель и запуск',container:document.getElementById('lp')}),g=this.g=new lil.GUI({title:'Регулировки'}),ta=document.getElementById('ta'),rs=()=>org.reset();
  this.upd=()=>{gl.controllersRecursive().forEach(c=>c.updateDisplay());g.controllersRecursive().forEach(c=>c.updateDisplay())};
  const act={
   rand:()=>{Object.assign(cfg,{branch:Math.random()*.4,angle:20+Math.random()*70,random:Math.random()*.6,density:Math.random(),temp:-20+Math.random()*60,wind:Math.random()*.7,taper:Math.random()});this.sync();org.recolor()},
   exp:()=>{ta.style.display='block';ta.value=JSON.stringify(cfg)},
   imp:()=>{try{Object.assign(cfg,JSON.parse(ta.value));syncArea();this.sync();org.reset()}catch(e){ta.value='Ошибка JSON'}}
  };
  const pr={'Пресет':'—'},fi=document.getElementById('f');fi.onchange=e=>{if(e.target.files[0])loadModel(e.target.files[0]);fi.value=''};
  // ЛЕВАЯ ПАНЕЛЬ
  const src=gl.addFolder('Источник и область');
  src.add({m:()=>fi.click()},'m').name('Загрузить модель (.obj/.glb)');
  src.add(cfg,'area',AREAS).name('Режим роста').onChange(()=>{applyArea();SEEDPT=null;rs()});
  src.add(cfg,'openSides',0,2,1).name('Допустимо открытых сторон (сосуд)').onChange(()=>{applyAllow();SEEDPT=null;rs()});
  src.add(cfg,'guide').name('Показать направляющую').onChange(v=>{if(guide)guide.visible=v});
  const pts=gl.addFolder('Точки роста');
  pickCtl=pts.add({p:togglePick},'p').name('Задать точку роста');
  pts.add({c:clearPick},'c').name('Сбросить точку роста');
  mixCtl=pts.add({m:toggleMix},'m').name('МИКС: добавить структуру');
  const look=gl.addFolder('Вид и пресеты');
  look.add(cfg,'shape',SHAPES).name('Форма элемента').onChange(applyShape);
  look.add(pr,'Пресет',['—',...Object.keys(PRESETS)]).onChange(v=>{const p=PRESETS[v];if(!p)return;const k={...p};
   if(cfg.area.startsWith('Модель')&&k.mode!=='Объём модели')delete k.mode; // загруженная модель не сбрасывается пресетами

  const mf=gl.addFolder('Меш и экспорт');

  mf.add({a:exportMeshSTL},'a').name('Скачать меш (STL)');mf.add({a:exportMeshOBJ},'a').name('Скачать меш (OBJ)');
  mf.add({a:exportOBJ},'a').name('Скачать кубы (OBJ)');mf.add({a:savePNG},'a').name('Сохранить PNG (2×)');
  gl.add({a:askReset},'a').name('Сбросить всё…');
  const sb=gl.add({a:startAction},'a').name('▶ СТАРТ');startBtn=sb.$button||sb.domElement.querySelector('button');startBtn.classList.add('startbtn');sb.domElement.classList.add('startc');
  // ПРАВАЯ ПАНЕЛЬ
  const th=g.addFolder('Размер и толщина');
  th.add(cfg,'modelMM',20,1000,1).name('Размер модели, мм');
  th.add(cfg,'tmin',.1,10,.05).name('Мин. толщина корня, мм');th.add(cfg,'tmax',1,20,.1).name('Макс. толщина корня, мм');
  th.add(cfg,'taper',0,1.5,.01).name('Сужение (толстые → тонкие)');th.add(cfg,'size',.05,1.5,.01).name('Масштаб ячейки / расстояний');
  const vf=g.addFolder('Заполнение (корни в объёме)');
  vf.add(cfg,'fill',0,1,.01).name('Плотность заполнения');vf.add(cfg,'decay',0,1,.01).name('Затухание плотности');
  vf.add(cfg,'wall',0,1,.01).name('По форме (корни вдоль стенки)');vf.add(cfg,'pers',0,1,.01).name('Прямолинейность');vf.add(cfg,'gap',0,4,.1).name('Отступ от стенок');

const org=new Organism(),ui=new UI(org);Environment.apply();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

(function loop(now){

 fr++;ft+=dt;if(ft>.5){hud.innerHTML='Кубов: '+org.n+' · Активных кончиков: '+org.tips.length+'<br>FPS: '+Math.round(fr/ft)+(org.run?'':'<br>Нажмите «Старт» (левая панель, внизу)')+meshInfo;fr=0;ft=0}
})(performance.now());
